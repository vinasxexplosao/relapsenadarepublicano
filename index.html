<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nada Republicano</title>
<style>
:root {
  --text-color-primary: #f5f0e8;
  --text-color-secondary: #b8b2a8;
  --text-color-tertiary: #8a857c;
  --background-color-primary: #0b0b0d;
  --surface-color-primary: #1d1d22;
  --surface-color-secondary: #15161a;
  --surface-color-hover: #ff8c1a;
  --text-color-primary-hover: #14100b;
  --text-color-secondary-hover: #14100b;
  font-size: 17px;
}
body {
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--background-color-primary);
  background-image: radial-gradient(ellipse 90% 55% at 50% -10%, rgba(255,110,0,.20) 0, rgba(0,0,0,0) 60%);
  color: var(--text-color-primary);
  font-family: "Segoe UI", Arial, sans-serif;
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  padding: 0;
  margin: 0;
  overflow: hidden;
  box-sizing: border-box;
}
a { color: var(--text-color-secondary); }
a:active, a:focus { outline: 0; border: none; }
h1.text-center {
  color: #f5f0e8;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-shadow: 0 2px 12px rgba(0,0,0,.8);
  margin-bottom: 2px;
}
#top-bar-text {
  color: #ff8c00;
  font-size: .85rem;
  letter-spacing: .5px;
}
#top-bar-text .fw-bold { color: #f5f0e8; }
.btn {
  padding: 1rem 2rem;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  margin: .2rem;
  cursor: pointer;
  line-height: 2.5rem;
  min-width: 5rem;
  border-radius: 12px;
  width: 50%;
  background-color: var(--surface-color-primary);
  background-image: linear-gradient(180deg, #ff8c1a 0%, #e35d00 100%);
  border: none;
  color: #14100b;
  font-size: 1.3rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: background-color .25s ease, box-shadow .25s ease;
  box-shadow: 0 6px 18px rgba(227,93,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
  box-sizing: border-box;
}
.btn:hover, .btn:focus {
  background-color: var(--surface-color-hover);
  color: var(--text-color-primary-hover);
  box-shadow: 0 6px 24px rgba(255,122,26,.5), inset 0 1px 0 rgba(255,255,255,.25);
}
.btn-secondary {
  padding: .5rem 2rem;
  font-size: 1rem;
  background-image: none;
  background-color: rgba(255,255,255,.05);
  color: #e8e4dd;
  border: 1px solid rgba(255,122,26,.45);
  box-shadow: none;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.btn-secondary:hover, .btn-secondary:focus {
  background-color: rgba(255,122,26,.14);
  color: #ffd700;
}
#main-content { position: relative; box-sizing: border-box; }
#main-content > div {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease-in-out;
  box-sizing: border-box;
  display: flex;
}
#pre-jb-view {
  display: block !important;
  padding-top: 18vh;
  text-align: center;
}
#pre-jb-view .btn {
  display: block;
  width: 70%;
  max-width: none;
  margin: .5rem auto;
}
.selected { opacity: 1 !important; pointer-events: auto !important; }
.position-relative { position: relative; }
.text-center { text-align: center; }
.fw-bold { font-weight: 800; }
.text-secondary {
  color: var(--text-color-secondary);
  margin: 0;
  padding: 0;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
  font-size: .8rem;
}
.p-2 { padding: .5rem !important; }
.mt-2 { margin-top: .5rem !important; }
.mb-2 { margin-bottom: .5rem !important; }
/* ---- creds & greetz, lifted verbatim from the poop2jb landing ---- */
#credits{
    position:fixed; bottom:14px; left:0; right:0;
    text-align:center; padding:0 16px; pointer-events:none;
}
#credits span{ display:block; color:#8a857c; font-size:0.8rem; font-weight:700;
               letter-spacing:.22em; margin-bottom:5px; }
#credits h3{ margin:0 auto; max-width:60rem; font-size:0.82rem; font-weight:700;
             color:#6f6a62; line-height:1.55; }
#basedon{ margin:9px 0 0; font-size:0.68rem; color:#55524c; letter-spacing:.05em;
           font-weight:400; }
</style>
</head>
<body>
  <div class="p-2">
        <h1 class="text-center">Nada Republicano</h1>
	<p class="text-center" style="color:#ff8c00;font-weight:700;letter-spacing:5px;font-size:.8em;text-transform:uppercase;margin:2px 0 8px;text-shadow:0 2px 10px rgba(0,0,0,.8);">Explosão do Game</p>
	<p class="text-center" style="color:#8a857c;font-size:.75rem;letter-spacing:1px;margin:0;">Relapse (7.00 - 13.60)</p>
  </div>
  <div id="main-content">
    <div id="pre-jb-view" class="selected">
      <a tabindex="0" class="btn fw-bold" id="run-jb" href="relapse.html">Jailbreak</a>
      <a tabindex="0" class="btn btn-secondary" id="run-sender" href="relapse.html?senderok=1">Payloads (sender)</a>
    </div>
  </div>
  <div id="credits">
    <span>creds &amp; greetz</span>
    <h3>
       AGRADECIMENTOS A TODOS NO CENÁRIO
    </h3>
    <p id="basedon">based on the Ralapse by j0rdy & soniciso1</p>
  </div>
    <script>
    try {
      var firmwareMatch = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
      var firmware = firmwareMatch ? firmwareMatch[1] : "";
      document.getElementById("current-fw").textContent = firmware || "Not detected";
    } catch (e) { }
    try { document.getElementById("run-jb").focus(); } catch (e) { }
  </script>
</body>
</html>
