<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADA REPUBLICANO - EXPLOSÃO DO GAME</title>
<link rel="stylesheet" href="main.css?v=final">
<style>
body {
  background: radial-gradient(circle at 50% 25%, #26120a 0, #120800 45%, #000000 100%) !important;
  color: #ffd700 !important;
}
h1 {
  color: #ffd700 !important;
  text-shadow: 2px 2px 0 #000, 0 0 18px rgba(255,140,0,.55);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.header-sub {
  color: #ff8c00 !important;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 0.85em;
  text-shadow: 1px 1px 0 #000;
  margin-top: -6px;
}
.btn {
  background: #1a0d00 !important;
  border: 2px solid #ff8c00 !important;
  color: #ffd700 !important;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 0 10px rgba(255,140,0,.35);
}
.btn:hover, .btn:focus {
  border-color: #ffd700 !important;
  box-shadow: 0 0 18px rgba(255,69,0,.6);
}
.text-secondary { color: #ff8c00 !important; }
#top-bar-text { color: #ff8c00 !important; }
.btn-row { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 8px 0; }
.btn-row .btn { display: block; width: 70%; max-width: 420px; text-align: center; padding: 12px 16px; }
</style>
</head>
<body>
<div class="p-2">
<h1 class="text-center">Nada Republicano</h1>
<p class="text-center header-sub">Explosão do Game</p>
<p class="text-center" id="top-bar-text">Firmware atual: <span class="fw-bold" id="current-fw">Desconhecido</span></p>
<p class="text-center text-secondary">POOPS: 7.00-12.00 | P2JB: 12.02-12.70 | RELAPSE: 13.00-13.60</p>
</div>
<div id="main-content">
<div id="pre-jb-view" class="selected">
<div class="btn-row">
<a tabindex="0" class="btn fw-bold" id="run-jb">Jailbreak</a>
<a tabindex="0" class="btn fw-bold" id="open-payloads" href="https://vinasxexplosao.github.io/relapsenadarepublicano/relapse.html?senderok=1">Cargas (Payloads)</a>
</div>
<p id="fw-status" hidden></p>
</div>
</div>
<div class="position-relative text-center p-2 mb-2">
<p class="text-secondary">Créditos</p>
<p class="text-secondary mt-2">Jordy, Egy, small dog, dr b, Zeco, Gezine, Echostretch, Ufm42, TheFloW, John Tornblom, Flatz, Idlesauce and PS5 R&amp;D Discord.</p>
</div>
<script>
try {
var POOPS_HREF = "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol"
+ "&attempts=8&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,"
+ "ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&log=debug"
+ "&payload=1&v=final";
var P2JB_HREF = "slopkit/p2jb.html?go=1&auto=1&production=1&log=debug"
+ "&payload=1&v=final";
var RELAPSE_HREF = "https://vinasxexplosao.github.io/relapsenadarepublicano/relapse.html";
var POOPS_FIRMWARES = [
  "7.00", "7.01", "7.20", "7.40", "7.60", "7.61",
  "8.00", "8.20", "8.40", "8.60",
  "9.00", "9.05", "9.20", "9.40", "9.60",
  "10.00", "10.01", "10.20", "10.40", "10.60",
  "11.00", "11.20", "11.40", "11.60", "12.00"
];
var P2JB_FIRMWARES = [
  "12.02", "12.20", "12.40", "12.60", "12.70"
];
var RELAPSE_FIRMWARES = [
  "13.00", "13.20", "13.40", "13.42", "13.60"
];
var ua = navigator.userAgent;
var fwStr = "";
var marker = "PlayStation 5/";
var idx = ua.indexOf(marker);
if (idx >= 0) {
  fwStr = ua.substring(idx + marker.length).split(" ")[0].split(";")[0].split(")")[0];
}
var el = document.getElementById("current-fw");
el.textContent = fwStr || "Nao detectado";
var jbButton = document.getElementById("run-jb");
var fwStatus = document.getElementById("fw-status");
var href = "";
if (POOPS_FIRMWARES.indexOf(fwStr) !== -1) href = POOPS_HREF;
else if (P2JB_FIRMWARES.indexOf(fwStr) !== -1) href = P2JB_HREF;
else if (RELAPSE_FIRMWARES.indexOf(fwStr) !== -1) href = RELAPSE_HREF;
if (href) {
  jbButton.setAttribute("href", href);
  try { jbButton.focus(); } catch (e) { }
} else {
  jbButton.classList.add("btn-disabled");
  jbButton.setAttribute("aria-disabled", "true");
  fwStatus.hidden = false;
  fwStatus.textContent = "Firmware nao suportado"
  + (fwStr ? ": " + fwStr : "")
  + ". Suportados: 7.00-12.00 (Poopsploit), 12.02-12.70 (P2JB), 13.00-13.60 (Relapse).";
}
} catch (e) { }
</script>
</body>
</html>
