<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NADA REPUBLICANO</title>
<link rel="stylesheet" href="main.css?v=final">
<style>
* { box-sizing: border-box; }
body {
  background: #0b0b0d !important;
  background-image: radial-gradient(ellipse 90% 55% at 50% -10%, rgba(255,110,0,.22) 0, rgba(255,110,0,0) 60%) !important;
  color: #e8e4dd !important;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  letter-spacing: .2px;
}
h1 {
  color: #f5f0e8 !important;
  font-weight: 700 !important;
  font-size: 1.9em !important;
  letter-spacing: 4px !important;
  text-transform: uppercase;
  margin-bottom: 2px !important;
}
.header-sub {
  color: #ff7a1a !important;
  font-size: .8em !important;
  font-weight: 600;
  letter-spacing: 6px !important;
  text-transform: uppercase;
  margin: 0 0 10px 0 !important;
}
.top-status {
  display: inline-block;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 30px;
  padding: 5px 16px;
  font-size: .85em;
  color: #b8b2a8 !important;
}
.top-status .fw-bold { color: #f5f0e8 !important; }
.led {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #6b6b6b; margin-right: 7px; vertical-align: middle;
}
.led.on { background: #ff7a1a; box-shadow: 0 0 6px rgba(255,122,26,.8); }
.fw-line {
  color: #8a857c !important; font-size: .82em !important;
  letter-spacing: 1px; margin: 8px 0 0 0 !important;
}
.card {
  max-width: 520px; margin: 22px auto 0 auto;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  padding: 26px 22px;
}
.btn {
  display: block;
  width: 100%;
  margin: 0 0 12px 0;
  padding: 15px 20px !important;
  background: linear-gradient(180deg, #ff8c1a 0%, #e35d00 100%) !important;
  border: none !important;
  border-radius: 10px;
  color: #14100b !important;
  font-weight: 700 !important;
  font-size: 1em !important;
  letter-spacing: 2px !important;
  text-transform: uppercase;
  box-shadow: 0 6px 18px rgba(227,93,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
}
.btn:last-child { margin-bottom: 0; }
.btn:focus { box-shadow: 0 6px 22px rgba(255,122,26,.55), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.btn-ghost {
  background: rgba(255,255,255,.05) !important;
  color: #e8e4dd !important;
  border: 1px solid rgba(255,122,26,.5) !important;
  box-shadow: none;
}
.btn.btn-ghost:focus { background: rgba(255,122,26,.14) !important; }
.btn-disabled { opacity: .35; }
.credits {
  max-width: 520px; margin: 26px auto 0 auto;
  color: #6f6a62 !important; font-size: .78em !important;
  line-height: 1.6; text-align: center;
}
.credits b { color: #9a948a !important; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="p-2" style="text-align:center; padding-top:26px;">
<h1 class="text-center">Nada Republicano</h1>
<p class="header-sub">Explosão do Game</p>
<p><span class="top-status"><span class="led" id="fw-led"></span>Firmware: <span class="fw-bold" id="current-fw">—</span></span></p>
<p class="fw-line">7.00–12.00 · Poops&ensp;|&ensp;12.02–12.70 · P2JB&ensp;|&ensp;13.00–13.60 · Relapse</p>
</div>
<div id="main-content">
<div id="pre-jb-view" class="selected">
<div class="card">
<a tabindex="0" class="btn fw-bold" id="run-jb">Jailbreak</a>
<a tabindex="0" class="btn fw-bold btn-ghost" id="open-payloads" href="https://vinasxexplosao.github.io/relapsenadarepublicano/relapse.html?senderok=1">Cargas · Payloads</a>
<p id="fw-status" hidden></p>
</div>
</div>
</div>
<div class="credits">
<b>Créditos</b><br>
Jordy, Egy, small dog, dr b, Zeco, Gezine, Echostretch, Ufm42, TheFloW, John Tornblom, Flatz, Idlesauce e PS5 R&amp;D Discord.
</div>
<script>
try {
var POOPS_HREF = "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol"
+ "&attempts=8&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,"
+ "ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&log=debug"
+ "&payload=1&v=final";
var P2JB_HREF = "slopkit/p2jb.html?go=1&auto=1&production=1&log=debug"
+ "&payload=1&v=final";
var RELAPSE_HREF = "https://vinasxexplosao.github.io/relapsenadarepublicano/relapse.html";
var POOPS_FIRMWARES = [
  "7.00", "7.01", "7.20", "7.40", "7.60", "7.61",
  "8.00", "8.20", "8.40", "8.60",
  "9.00", "9.05", "9.20", "9.40", "9.60",
  "10.00", "10.01", "10.20", "10.40", "10.60",
  "11.00", "11.20", "11.40", "11.60", "12.00"
];
var P2JB_FIRMWARES = [ "12.02", "12.20", "12.40", "12.60", "12.70" ];
var RELAPSE_FIRMWARES = [ "13.00", "13.20", "13.40", "13.42", "13.60" ];
var ua = navigator.userAgent;
var fwStr = "";
var marker = "PlayStation 5/";
var idx = ua.indexOf(marker);
if (idx >= 0) {
  fwStr = ua.substring(idx + marker.length).split(" ")[0].split(";")[0].split(")")[0];
}
var el = document.getElementById("current-fw");
el.textContent = fwStr || "não detectado";
var led = document.getElementById("fw-led");
if (fwStr) led.className = "led on";
var jbButton = document.getElementById("run-jb");
var fwStatus = document.getElementById("fw-status");
var href = "";
if (POOPS_FIRMWARES.indexOf(fwStr) !== -1) href = POOPS_HREF;
else if (P2JB_FIRMWARES.indexOf(fwStr) !== -1) href = P2JB_HREF;
else if (RELAPSE_FIRMWARES.indexOf(fwStr) !== -1) href = RELAPSE_HREF;
if (href) {
  jbButton.setAttribute("href", href);
  try { jbButton.focus(); } catch (e) { }
} else {
  jbButton.classList.add("btn-disabled");
  jbButton.setAttribute("aria-disabled", "true");
  fwStatus.hidden = false;
  fwStatus.textContent = "Firmware não suportado"
  + (fwStr ? ": " + fwStr : "")
  + ". Suportados: 7.00–12.00, 12.02–12.70, 13.00–13.60.";
}
} catch (e) { }
</script>
</body>
</html>
